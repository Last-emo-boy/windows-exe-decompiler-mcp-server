name: Publish static OCI candidate from main

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rikune-static-publication-main
  cancel-in-progress: false

env:
  STATIC_IMAGE: ghcr.io/last-emo-boy/rikune-analyzer-static
  LOOM_REPOSITORY_URL: ${{ vars.LOOM_REPOSITORY_URL || 'https://git.w33d.xyz/git/w33d/rikune.git' }}
  LOOM_READ_USERNAME: ${{ vars.LOOM_READ_USERNAME || 'w33d' }}
  COSIGN_IDENTITY: https://github.com/Last-emo-boy/rikune/.github/workflows/publish-static.yml@refs/heads/main
  COSIGN_ISSUER: https://token.actions.githubusercontent.com

jobs:
  static:
    name: Verify, publish, and sign static-only candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Verify clean mirrored main before build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOM_READ_TOKEN: ${{ secrets.LOOM_READ_TOKEN }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/rikune-static-release"
          node scripts/verify-static-source.mjs > "$RUNNER_TEMP/rikune-static-release/source-before.json"

      - name: Build and test the corrected static source
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --test scripts/verify-static-source.test.mjs
          npm test -- --runInBand tests/unit/core tests/unit/artifact-read.test.ts tests/unit/decompiler-worker.test.ts tests/unit/ghidra-analyze.test.ts tests/unit/static-profile-contract.test.ts
          npm run docker:generate:static
          git diff --exit-code -- static-profile.lock.json docker/Dockerfile.analyzer docker-compose.analyzer.yml
          test -z "$(git status --porcelain)"

      - name: Choose a new candidate reference
        id: reference
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          echo "candidate=$STATIC_IMAGE:build-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: |
            image=docker.io/moby/buildkit@sha256:040d34121c27906c4ff9ac152a30d52bf2c5d328d3bb748916bb3d2743c02528

      - name: Refuse to overwrite an existing candidate
        env:
          CANDIDATE: ${{ steps.reference.outputs.candidate }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$CANDIDATE" > "$RUNNER_TEMP/rikune-static-release/candidate-inspect.txt" 2> "$RUNNER_TEMP/rikune-static-release/candidate-inspect.err"; then
            echo "Candidate already exists; refusing overwrite" >&2
            exit 1
          fi
          bash scripts/registry-ref-is-absent.sh "$CANDIDATE" "$RUNNER_TEMP/rikune-static-release/candidate-inspect.err"

      - name: Build and push the static candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.analyzer
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.reference.outputs.candidate }}
          labels: |
            org.opencontainers.image.source=https://github.com/Last-emo-boy/rikune
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.reference.outputs.version }}
            org.opencontainers.image.rikune.profile=static
          cache-from: type=gha,scope=rikune-static-main
          cache-to: type=gha,mode=max,scope=rikune-static-main

      - name: Recheck mirrored main before signing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOM_READ_TOKEN: ${{ secrets.LOOM_READ_TOKEN }}
        run: node scripts/verify-static-source.mjs > "$RUNNER_TEMP/rikune-static-release/source-after.json"

      - name: Verify the published immutable static image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          ref="$STATIC_IMAGE@$DIGEST"
          docker buildx imagetools inspect "$ref" --raw |
            jq -e '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length == 1'
          docker buildx imagetools inspect "$ref" --format '{{json .Provenance}}' |
            jq -e 'type == "object" and length > 0'
          docker buildx imagetools inspect "$ref" --format '{{json .SBOM}}' |
            jq -e 'type == "object" and length > 0'
          docker pull --platform linux/amd64 "$ref"
          test "$(docker image inspect "$ref" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$ref" --format '{{index .Config.Labels "org.opencontainers.image.rikune.profile"}}')" = static
          bash scripts/verify-static-container.sh "$ref"

      - name: Generate registry-derived SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.STATIC_IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/rikune-static-release/static-image.spdx.json
          upload-artifact: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-name: ${{ env.STATIC_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        with:
          subject-name: ${{ env.STATIC_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/rikune-static-release/static-image.spdx.json
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign and verify the exact image digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$STATIC_IMAGE@$DIGEST"
          cosign sign --yes "$ref"
          cosign verify --certificate-identity "$COSIGN_IDENTITY" --certificate-oidc-issuer "$COSIGN_ISSUER" "$ref" > /dev/null
          for predicate in https://slsa.dev/provenance/v1 https://spdx.dev/Document/v2.3; do
            gh attestation verify "oci://$ref" --repo "$GITHUB_REPOSITORY" \
              --source-digest "$GITHUB_SHA" --source-ref refs/heads/main \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-static.yml" \
              --predicate-type "$predicate" > /dev/null
          done

      - name: Record and sign static-only publication evidence
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          CANDIDATE: ${{ steps.reference.outputs.candidate }}
          PACKAGE_VERSION: ${{ steps.reference.outputs.version }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/rikune-static-release"
          jq -n --arg revision "$GITHUB_SHA" --arg image "$STATIC_IMAGE@$DIGEST" \
            --arg candidate "$CANDIDATE" --arg version "$PACKAGE_VERSION" \
            --arg lock_sha256 "$(sha256sum static-profile.lock.json | cut -d' ' -f1)" \
            --arg source_proof_sha256 "$(sha256sum "$evidence/source-after.json" | cut -d' ' -f1)" \
            '{schema_version:1,scope:"static-oci-only",source_revision:$revision,image:$image,
              candidate:$candidate,package_version:$version,static_lock_sha256:$lock_sha256,
              source_proof_sha256:$source_proof_sha256,npm_published:false,version_aliases_updated:false}' \
            > "$evidence/static-image.json"
          cosign sign-blob --yes --bundle "$evidence/static-image.sigstore.json" "$evidence/static-image.json"
          cosign verify-blob --bundle "$evidence/static-image.sigstore.json" \
            --certificate-identity "$COSIGN_IDENTITY" --certificate-oidc-issuer "$COSIGN_ISSUER" "$evidence/static-image.json"

      - name: Upload verified static evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rikune-static-main-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rikune-static-release/source-before.json
            ${{ runner.temp }}/rikune-static-release/source-after.json
            ${{ runner.temp }}/rikune-static-release/static-image.json
            ${{ runner.temp }}/rikune-static-release/static-image.sigstore.json
            ${{ runner.temp }}/rikune-static-release/static-image.spdx.json
          if-no-files-found: error
          retention-days: 30
